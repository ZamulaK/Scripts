<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas Lounge · Install</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1020">
<!-- A public page (Cloudflare Access lets everyone through to /install, /manifest.webmanifest and /icons) so tools that
     package the site as an app, like PWABuilder, can find its manifest; the site itself stays behind the sign-in (Nov 5) -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#e8ecf6;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  img{width:96px;height:96px;border-radius:22px}
  h1{font-size:22px;margin:16px 0 6px}
  p{color:#bcc6db;margin:0 0 20px}
  a{display:inline-block;background:#8fb4ff;color:#0b1020;font-weight:700;text-decoration:none;padding:10px 20px;border-radius:999px}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Christmas Lounge</h1>
  <p>SomaFM Christmas Lounge: what's playing, the play history, and the Xmas Mixed playlist. Sign-in required.</p>
  <a href="/">Open Christmas Lounge</a>
</main>
</body>
</html>
