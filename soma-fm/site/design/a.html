<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas Lounge · Design A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#16191d;--muted:#5d6670;--line:#e3e6ea;--accent:#1f7a4d;--accent-ink:#fff;--soft:#e8f3ed;--warn:#b26b00;--bad:#b3261e;--side:#ffffff}
:root[data-theme="dark"]{--bg:#111417;--panel:#191d21;--ink:#e9edf0;--muted:#9aa4ad;--line:#2a3036;--accent:#4cc38a;--accent-ink:#0b1a12;--soft:#16281f;--warn:#e0a84a;--bad:#ef7a72;--side:#15181b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111417;--panel:#191d21;--ink:#e9edf0;--muted:#9aa4ad;--line:#2a3036;--accent:#4cc38a;--accent-ink:#0b1a12;--soft:#16281f;--warn:#e0a84a;--bad:#ef7a72;--side:#15181b}}
:root[data-accent="red"]{--accent:#c0392b;--soft:#fbeceb}
:root[data-accent="blue"]{--accent:#2563eb;--soft:#e8effd}
:root[data-theme="dark"][data-accent="red"]{--accent:#f07167;--soft:#2a1716}
:root[data-theme="dark"][data-accent="blue"]{--accent:#7aa7ff;--soft:#172033}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 8px 18px}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500;cursor:pointer}
nav a:hover{background:var(--bg);color:var(--ink)}
nav a.on{background:var(--soft);color:var(--accent)}
nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;font-size:12.5px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}
main{padding:28px 32px;max-width:1100px;width:100%}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;gap:16px}
.cards{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em}
.kpi span{color:var(--muted);font-size:13px}
.now{display:flex;gap:18px;align-items:center;padding:20px}
.cover{width:72px;height:72px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:22px;color:#fff;flex:none}
.now .t{font-size:20px;font-weight:700}
.now .a{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap}
.badge.disliked,.badge.none{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.badge.other,.badge.gone{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:8px 12px;font:inherit;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--soft);color:var(--accent);font-weight:600}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr:hover td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.song{display:flex;gap:12px;align-items:center}
.song .cover{width:36px;height:36px;border-radius:8px;font-size:13px}
.song small{display:block;color:var(--muted)}
.time{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 8px;cursor:pointer;color:var(--muted);font:inherit;font-size:13px}
.star{color:#e3a008}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin:12px 0 6px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.two{grid-template-columns:2fr 1fr}
.swatches{display:flex;gap:10px}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.swatches button.on{outline:2px solid var(--ink);outline-offset:2px}
.mock{position:fixed;right:14px;bottom:14px;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 10px;border-radius:8px;opacity:.85}
.hide-sm{}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line);z-index:5;justify-content:space-around}
  .brand,.side-foot{display:none}
  nav{display:contents}
  nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px}
  main{padding:20px 16px 90px}
  .two{grid-template-columns:1fr}
  .hide-sm{display:none}
  .mock{bottom:76px}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><i>❄</i>Christmas Lounge</div>
    <nav id="nav"></nav>
    <div class="side-foot"><span class="dot"></span>Recording · checked 3 min ago</div>
  </aside>
  <main id="main"></main>
</div>
<div class="mock">Design A · Studio — mockup</div>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
const { LABEL, esc, time, day, ago, initials, hue, fmt, CAT, store } = XLH, D = XL;
const root = document.documentElement;
root.dataset.theme = store.get('a-theme') || 'auto'; root.dataset.accent = store.get('a-accent') || 'green';
const I = {
  now: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  history: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
  songs: '<path d="M3 6h18M3 12h18M3 18h12"/>',
  stats: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  shuffle: '<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
const VIEWS = [['now', 'Now playing'], ['history', 'History'], ['songs', 'Songs'], ['stats', 'Stats'], ['shuffle', 'Shuffle'], ['settings', 'Settings']];
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const cover = (a, cls = '') => `<div class="cover ${cls}" style="background:hsl(${hue(a)} 45% 42%)">${esc(initials(a))}</div>`;
const badge = s => `<span class="badge ${s}">${LABEL[s] || s}</span>`;
let filter = 'all', q = '';
function songRows(list) {
  return `<table><thead><tr><th>Song</th><th class="hide-sm">Category</th><th>Status</th><th class="hide-sm">Plays</th><th>Time</th></tr></thead><tbody>${list.map(p => `
    <tr><td><div class="song">${cover(p.artist)}<div>${esc(p.title)} ${p.fav ? '<span class="star">★</span>' : ''}<small>${esc(p.artist)}</small></div></div></td>
    <td class="hide-sm">${esc(CAT[p.cat] || '—')}</td><td>${badge(p.status)}</td><td class="hide-sm">${p.plays}</td><td class="time">${time(p.at)}</td></tr>`).join('')}</tbody></table>`;
}
const R = {
  now() {
    const n = D.now, t = D.totals;
    return `<h1>Now playing</h1><p class="sub">SomaFM Christmas Lounge · recorded around the clock</p>
    <div class="grid two"><div class="card now">${cover(n.artist)}<div style="flex:1"><div class="t">${esc(n.title)}</div><div class="a">${esc(n.artist)} · ${esc(n.album)}</div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${badge(n.status)} <span class="badge">Played ${n.plays}×</span> ${n.fav ? '<span class="badge">★ Favorite</span>' : ''}</div></div>
      <button class="icon-btn hide-sm">Open on YouTube</button></div>
      <div class="card kpi"><b>${t.backHours} h</b><span>until a song comes back, on average</span></div></div>
    <div class="grid cards" style="margin:16px 0">
      <div class="card kpi"><b>${fmt(t.plays)}</b><span>plays recorded</span></div>
      <div class="card kpi"><b>${fmt(t.songs)}</b><span>different songs</span></div>
      <div class="card kpi"><b>${fmt(t.playlist)}</b><span>in your playlist</span></div>
      <div class="card kpi"><b>${fmt(t.favorites)}</b><span>favorites</span></div></div>
    <div class="card" style="padding:4px 6px"><div class="row" style="padding:10px 12px 0"><b>Just played</b><a style="color:var(--accent);cursor:pointer" onclick="go('history')">See all →</a></div>${songRows(D.plays.slice(1, 9))}</div>`;
  },
  history() {
    const list = D.plays.filter(p => (filter === 'all' || p.status === filter) && (!q || (p.title + ' ' + p.artist).toLowerCase().includes(q)));
    const seg = [['all', 'All'], ['have', 'In playlist'], ['other', 'Other version'], ['none', 'Not in playlist'], ['disliked', 'Disliked']]
      .map(([k, l]) => `<button class="${filter === k ? 'on' : ''}" onclick="filter='${k}';draw()">${l}</button>`).join('');
    return `<h1>History</h1><p class="sub">Every play, newest first · ${day(D.plays[0].at)}</p>
    <div class="toolbar"><input class="search" placeholder="Search songs or artists" value="${esc(q)}" oninput="q=this.value.toLowerCase();draw(true)"><div class="seg">${seg}</div><button class="icon-btn">Export CSV</button></div>
    <div class="card" style="padding:4px 6px">${list.length ? songRows(list) : '<p style="padding:16px;color:var(--muted)">No plays match.</p>'}</div>`;
  },
  songs() {
    const seen = new Map(); for (const p of D.plays) if (!seen.has(p.title + p.artist)) seen.set(p.title + p.artist, p);
    return `<h1>Songs</h1><p class="sub">Each song once, with how it matches your YouTube playlist</p>
    <div class="grid cards">${[...seen.values()].slice(0, 12).map(p => `<div class="card"><div class="song">${cover(p.artist)}<div><b>${esc(p.title)}</b><small>${esc(p.artist)}</small></div></div>
      <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">${badge(p.status)}<span class="time">${p.plays} plays</span></div>
      ${p.note ? `<p style="margin:10px 0 0;color:var(--muted);font-size:13px">“${esc(p.note)}”</p>` : ''}</div>`).join('')}</div>`;
  },
  stats() {
    const t = D.totals, by = t.by, tot = Object.values(by).reduce((a, b) => a + b, 0), cats = Object.entries(t.cats).sort((a, b) => b[1] - a[1]), max = cats[0][1];
    return `<h1>Stats</h1><p class="sub">Since ${day(t.since)}</p>
    <div class="grid cards" style="margin-bottom:16px">
      <div class="card kpi"><b>${Math.round(by.have / tot * 100)}%</b><span>of songs played are in your playlist</span></div>
      <div class="card kpi"><b>${t.backHours} h</b><span>until a song comes back</span></div>
      <div class="card kpi"><b>${fmt(by.disliked || 0)}</b><span>songs disliked</span></div></div>
    <div class="grid two"><div class="card"><b>Songs by status</b>${Object.entries(by).map(([k, v]) => `<div class="row"><span>${LABEL[k]}</span><span>${v}</span></div><div class="bar"><i style="width:${v / tot * 100}%"></i></div>`).join('')}</div>
    <div class="card"><b>Categories</b>${cats.map(([k, v]) => `<div class="row"><span>${CAT[k]}</span><span>${v}</span></div><div class="bar"><i style="width:${v / max * 100}%"></i></div>`).join('')}</div></div>`;
  },
  shuffle() {
    return `<h1>Shuffle</h1><p class="sub">Reorders your YouTube playlist so favorites, artists and categories are spread out</p>
    <div class="grid two"><div class="card"><b>Ready to shuffle ${D.totals.playlist} songs</b><p style="color:var(--muted)">Takes about 140 moves, roughly 7,200 quota units. You're signed in with Google.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn">Plan a new order</button><button class="btn ghost">Put back the earlier order</button></div></div>
      <div class="card"><b>Quota today</b><div class="row"><span>About 10,000 units left</span><span>0 used</span></div><div class="bar"><i style="width:2%"></i></div>
      <p style="color:var(--muted);font-size:13px">Resets at midnight Pacific. Counted on all your devices.</p><p style="font-size:13px">Last shuffle: ${day(D.plays[30].at)}</p></div></div>`;
  },
  settings() {
    const th = root.dataset.theme, ac = root.dataset.accent;
    return `<h1>Settings</h1><p class="sub">Look and feel, sync and backups</p>
    <div class="grid two"><div class="card"><b>Theme</b><div class="toolbar" style="margin-top:10px"><div class="seg">${['auto', 'light', 'dark'].map(k => `<button class="${th === k ? 'on' : ''}" onclick="setTheme('${k}')">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div></div>
      <b>Accent</b><div class="swatches" style="margin-top:10px">${[['green', '#1f7a4d'], ['red', '#c0392b'], ['blue', '#2563eb']].map(([k, c]) => `<button class="${ac === k ? 'on' : ''}" style="background:${c}" aria-label="${k}" onclick="setAccent('${k}')"></button>`).join('')}</div></div>
      <div class="card"><b>Your data</b><p style="color:var(--muted)">Kept on your Cloudflare account. Every device sees the same.</p><button class="btn ghost">Download a backup</button></div></div>`;
  }
};
let view = location.hash.slice(1) || 'now';
function draw(keepFocus) {
  if (!R[view]) view = 'now';
  document.getElementById('nav').innerHTML = VIEWS.map(([k, l]) => `<a class="${view === k ? 'on' : ''}" href="#${k}">${svg(k)}<span>${l}</span></a>`).join('');
  const m = document.getElementById('main'), had = keepFocus && document.activeElement && document.activeElement.className === 'search';
  m.innerHTML = R[view]();
  if (had) { const s = m.querySelector('.search'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}
function go(v) { location.hash = v; }
function setTheme(t) { root.dataset.theme = t; store.set('a-theme', t); draw(); }
function setAccent(a) { root.dataset.accent = a; store.set('a-accent', a); draw(); }
addEventListener('hashchange', () => { view = location.hash.slice(1) || 'now'; draw(); scrollTo(0, 0); });
draw();
</script>
</body>
</html>
