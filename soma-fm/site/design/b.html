<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas Lounge · Design B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f8;--card:#ffffff;--ink:#0f1b2a;--muted:#5b6b7d;--line:#dbe3ec;--accent:#2b6cb0;--accent2:#7fb3e6;--on:#fff;--chip:#e2ebf5;--good:#1f8a5b;--warn:#b7791f;--bad:#c53030;--hero1:#2b6cb0;--hero2:#7fb3e6}
:root[data-theme="midnight"]{--bg:#0b1020;--card:#141b2f;--ink:#e8ecf6;--muted:#97a3bd;--line:#232c45;--accent:#8fb4ff;--accent2:#4b5fd6;--on:#0b1020;--chip:#1c2540;--good:#5ad19a;--warn:#f0b955;--bad:#ff8a80;--hero1:#283a8f;--hero2:#6a3fb5}
:root[data-theme="candy"]{--bg:#fbf3f1;--card:#ffffff;--ink:#2a1414;--muted:#7a5a58;--line:#f0dcd8;--accent:#c8102e;--accent2:#e86a5c;--on:#fff;--chip:#f8e3df;--good:#1f7a4d;--warn:#b26b00;--bad:#c8102e;--hero1:#c8102e;--hero2:#1f7a4d}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0b1020;--card:#141b2f;--ink:#e8ecf6;--muted:#97a3bd;--line:#232c45;--accent:#8fb4ff;--accent2:#4b5fd6;--on:#0b1020;--chip:#1c2540;--good:#5ad19a;--warn:#f0b955;--bad:#ff8a80;--hero1:#283a8f;--hero2:#6a3fb5}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 100px}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
header b{font-size:20px;font-weight:800;letter-spacing:-.02em}
header span{font-size:12.5px;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 25%,transparent)}
.hero{border-radius:24px;padding:22px;color:#fff;background:linear-gradient(135deg,var(--hero1),var(--hero2));position:relative;overflow:hidden}
.hero:after{content:"❄";position:absolute;right:-10px;top:-30px;font-size:140px;opacity:.12}
.hero small{text-transform:uppercase;letter-spacing:.12em;font-size:11px;opacity:.85}
.hero h2{margin:8px 0 2px;font-size:24px;line-height:1.2}
.hero p{margin:0;opacity:.9}
.hero .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;border:0;font-family:inherit;cursor:pointer}
.hero .pill{background:rgba(255,255,255,.18);color:#fff}
.hero .pill.solid{background:#fff;color:var(--hero1)}
h3{font-size:15px;margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
h3 a{font-size:13px;color:var(--accent);font-weight:600;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chip{flex:none;background:var(--chip);color:var(--ink);border:0;border-radius:999px;padding:8px 14px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);color:var(--on)}
.list{background:var(--card);border-radius:20px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.tile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.item .tx small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{width:10px;height:10px;border-radius:50%;flex:none}
.st.have{background:var(--good)}.st.other,.st.gone{background:var(--warn)}.st.none,.st.disliked{background:var(--bad)}
.tm{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.tm .fav{color:#e3a008}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{background:var(--card);border-radius:20px;padding:16px}
.box b.big{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em}
.box span{color:var(--muted);font-size:13px}
.ring{width:132px;height:132px;border-radius:50%;margin:6px auto 12px;display:grid;place-items:center}
.ring div{width:100px;height:100px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-weight:800;font-size:22px}
.ring small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.legend{display:flex;gap:14px;justify-content:center;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.big-btn{width:100%;padding:15px;border-radius:16px;border:0;background:var(--accent);color:var(--on);font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.big-btn.alt{background:var(--chip);color:var(--ink);margin-top:10px}
.meter{height:12px;border-radius:8px;background:var(--chip);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;width:3%;background:var(--accent)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme{border-radius:16px;padding:12px;border:2px solid var(--line);cursor:pointer;background:var(--card);font:inherit;color:var(--ink);text-align:left}
.theme.on{border-color:var(--accent)}
.theme i{display:block;height:34px;border-radius:10px;margin-bottom:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:5}
.tabs div{display:flex;max-width:560px;width:100%;justify-content:space-around}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:12px}
.tabs a.on{color:var(--accent)}
.tabs svg{width:22px;height:22px}
.mock{position:fixed;bottom:84px;right:10px;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:8px;opacity:.85;z-index:6}
@media (min-width:900px){.wrap{max-width:900px}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.split h3:first-child{margin-top:0}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs"><div id="tabs"></div></nav>
<div class="mock">Design B · Pocket — mockup</div>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
const { LABEL, esc, time, day, ago, initials, hue, fmt, CAT, store } = XLH, D = XL;
const root = document.documentElement;
const savedTheme = store.get('b-theme'); if (savedTheme) root.dataset.theme = savedTheme;
const I = {
  now: '<circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z"/>',
  history: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
  stats: '<path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',
  shuffle: '<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
  more: '<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'
};
const TABS = [['now', 'Now'], ['history', 'History'], ['stats', 'Stats'], ['shuffle', 'Shuffle'], ['more', 'More']];
const tile = a => `<div class="tile" style="background:hsl(${hue(a)} 55% 45%)">${esc(initials(a))}</div>`;
const item = p => `<div class="item">${tile(p.artist)}<div class="tx"><b>${esc(p.title)}</b><small>${esc(p.artist)} · ${LABEL[p.status]}</small></div><div class="tm">${p.fav ? '<span class="fav">★</span> ' : ''}${time(p.at)}<br>${p.plays}×</div><span class="st ${p.status}"></span></div>`;
let chip = 'all';
const head = sub => `<header><div><b>Christmas Lounge</b><br><span>${sub}</span></div><span class="live"><i></i>Live</span></header>`;
const R = {
  now() {
    const n = D.now;
    return head('SomaFM · recorded around the clock') + `<div class="split"><div>
      <div class="hero"><small>Now playing · ${LABEL[n.status]}</small><h2>${esc(n.title)}</h2><p>${esc(n.artist)}</p>
      <div class="acts"><button class="pill solid">▶ YouTube</button><button class="pill">${n.fav ? '★ Favorite' : '☆ Favorite'}</button><button class="pill">✎ Note</button></div></div>
      <div class="g2" style="margin-top:12px"><div class="box"><b class="big">${D.totals.backHours} h</b><span>until a song comes back</span></div><div class="box"><b class="big">${fmt(D.totals.plays)}</b><span>plays recorded</span></div></div></div>
      <div><h3>Just played <a onclick="location.hash='history'">See all</a></h3><div class="list">${D.plays.slice(1, 8).map(item).join('')}</div></div></div>`;
  },
  history() {
    const list = D.plays.filter(p => chip === 'all' || (chip === 'fav' ? p.fav : p.status === chip));
    const chips = [['all', 'All'], ['have', 'In playlist'], ['other', 'Other version'], ['none', 'Not in playlist'], ['disliked', 'Disliked'], ['fav', '★ Favorites']]
      .map(([k, l]) => `<button class="chip ${chip === k ? 'on' : ''}" onclick="chip='${k}';draw()">${l}</button>`).join('');
    return head('Every play, newest first') + `<div class="chips">${chips}</div><div class="list">${list.length ? list.map(item).join('') : '<div class="item"><div class="tx"><small>No plays match.</small></div></div>'}</div>`;
  },
  stats() {
    const by = D.totals.by, tot = Object.values(by).reduce((a, b) => a + b, 0), pct = Math.round(by.have / tot * 100);
    const cats = Object.entries(D.totals.cats).sort((a, b) => b[1] - a[1]);
    return head('Since ' + day(D.totals.since)) + `<div class="split"><div class="box"><div class="ring" style="background:conic-gradient(var(--good) 0 ${pct}%,var(--bad) ${pct}% 100%)"><div>${pct}%<small>in playlist</small></div></div>
      <div class="legend"><span><i style="background:var(--good)"></i>${by.have} in playlist</span><span><i style="background:var(--bad)"></i>${by.disliked || 0} disliked</span></div></div>
      <div><div class="g2"><div class="box"><b class="big">${fmt(D.totals.songs)}</b><span>different songs</span></div><div class="box"><b class="big">${D.totals.favorites}</b><span>favorites</span></div></div>
      <h3>Categories</h3><div class="list">${cats.map(([k, v]) => `<div class="item"><div class="tx"><b>${CAT[k]}</b></div><div class="tm" style="font-size:14px;color:var(--ink);font-weight:700">${v}</div></div>`).join('')}</div></div></div>`;
  },
  shuffle() {
    return head('Reorder your YouTube playlist') + `<div class="box"><b class="big">${D.totals.playlist} songs</b><span>About 140 moves · roughly 7,200 quota units</span>
      <div class="meter"><i></i></div><span>About 10,000 units left today, on all your devices · resets at midnight Pacific</span></div>
      <div style="margin-top:14px"><button class="big-btn">Plan a new order</button><button class="big-btn alt">Put back the earlier order</button></div>`;
  },
  more() {
    const th = root.dataset.theme || '';
    const T = [['', 'Frost', 'linear-gradient(135deg,#2b6cb0,#7fb3e6)'], ['midnight', 'Midnight', 'linear-gradient(135deg,#283a8f,#6a3fb5)'], ['candy', 'Candy cane', 'linear-gradient(135deg,#c8102e,#1f7a4d)']];
    return head('Settings and your data') + `<h3>Theme</h3><div class="themes">${T.map(([k, l, g]) => `<button class="theme ${th === k ? 'on' : ''}" onclick="setTheme('${k}')"><i style="background:${g}"></i>${l}</button>`).join('')}</div>
      <h3>Your data</h3><div class="list"><div class="item"><div class="tx"><b>Download a backup</b><small>Plays, marks, favorites, notes</small></div></div>
      <div class="item"><div class="tx"><b>Export plays (CSV)</b><small>For a spreadsheet</small></div></div><div class="item"><div class="tx"><b>Sync</b><small>Kept on your Cloudflare account · every device the same</small></div></div></div>`;
  }
};
const DEF = 'now';
let view = location.hash.slice(1) || DEF;
function draw() {
  if (!R[view]) view = DEF;
  document.getElementById('tabs').innerHTML = TABS.map(([k, l]) => `<a class="${view === k ? 'on' : ''}" href="#${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>${l}</a>`).join('');
  document.getElementById('app').innerHTML = R[view]();
}
function setTheme(t) { if (t) root.dataset.theme = t; else delete root.dataset.theme; store.set('b-theme', t); draw(); }
addEventListener('hashchange', () => { view = location.hash.slice(1) || 'now'; draw(); scrollTo(0, 0); });
draw();
</script>
</body>
</html>
