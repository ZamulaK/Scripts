# SomaFM recorder: looks at SomaFM's song list every 10 minutes and keeps every play (see README.md)
name = "soma-recorder"
main = "src/index.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["*/10 * * * *"]

[vars]
CHANNELS = "christmas"   # stations to record, comma-separated (the part of the address before /songhistory.html)
ALLOW_ORIGIN = "https://somafm.com"

[[d1_databases]]
binding = "DB"
database_name = "soma"
database_id = "66275f3e-568b-400f-97ed-428fd00c91e8"   # from `wrangler d1 create soma` (not secret)
